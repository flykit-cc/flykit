# Runs on PRs and on direct pushes to main — most work here lands without a PR.
name: Checks

on:
  pull_request:
    branches: [main]
  # Also on direct pushes to main. Most work here lands straight on main without
  # a PR, so a pull_request-only workflow would never see it — which is exactly
  # how the flow 0.2.0 stale-version bug shipped unnoticed.
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json
        run: jq empty .claude-plugin/marketplace.json

      # Every plugin now lives in its own repo, so the manifest is a list of
      # addresses. A wrong address is only discoverable at install time, and a
      # version that disagrees with the plugin's own plugin.json makes
      # `/plugin update` a silent no-op — the exact failure that cost a session
      # on flow 0.2.0. Both are checked here instead.
      - name: Every plugin source resolves and its version agrees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r row; do
            name=$(jq -r '.name' <<<"$row")
            repo=$(jq -r '.source.repo // empty' <<<"$row")
            declared=$(jq -r '.version // empty' <<<"$row")

            if [ -z "$repo" ]; then
              echo "::error file=.claude-plugin/marketplace.json::'$name' has no source.repo"
              fail=$((fail+1)); continue
            fi
            if [ -z "$declared" ]; then
              echo "::error file=.claude-plugin/marketplace.json::'$name' has no version"
              fail=$((fail+1)); continue
            fi

            manifest=$(gh api "repos/$repo/contents/.claude-plugin/plugin.json" \
              --jq '.content' 2>/dev/null | base64 -d || true)
            if [ -z "$manifest" ]; then
              echo "::error file=.claude-plugin/marketplace.json::'$name' points at $repo, which has no .claude-plugin/plugin.json"
              fail=$((fail+1)); continue
            fi

            actual=$(jq -r '.version // empty' <<<"$manifest")
            if [ "$actual" != "$declared" ]; then
              echo "::error file=.claude-plugin/marketplace.json::'$name' says $declared but $repo says $actual. An install is keyed by version; a mismatch makes /plugin update a silent no-op."
              fail=$((fail+1)); continue
            fi
            echo "ok: $name $declared -> $repo"
          done < <(jq -c '.plugins[]' .claude-plugin/marketplace.json)
          [ "$fail" -eq 0 ]
