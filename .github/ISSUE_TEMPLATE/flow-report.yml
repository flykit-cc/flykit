name: Flow report
description: A bug or feature request for the flow plugin
labels: ["flow"]
body:
  - type: markdown
    attributes:
      value: |
        Running `/flow:issue` inside any project fills this in for you, and checks
        first whether you are on an older version where the bug may already be fixed.
  - type: input
    id: version
    attributes:
      label: Version
      description: Installed flow version, and the latest if you know it.
      placeholder: "0.5.9 (latest 0.5.9)"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "/flow:continue"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: The project state that triggers it. No paths, client names, or secrets.
    validations:
      required: false
